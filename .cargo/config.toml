[target.riscv32imc-unknown-none-elf]
runner = "probe-rs run --chip=esp32c3 --preverify --always-print-stacktrace --no-location --catch-hardfault --rtt-scan-memory"

[env]
DEFMT_LOG="info"
SSID = "your_wifi_ssid"
PASSWORD = "your_wifi_password"
MQTT_BROKER = "10.0.1.0"
MQTT_PORT = "1883"
ROBOT_ID = "0"

[build]
target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
